[env:esp32-s3-devkitc-n16r8-sx1262]
board_level = extra
extends = esp32s3_base
board = esp32-s3-devkitc-n16r8-sx1262
board_build.arduino.memory_type = dio_opi
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
upload_protocol = esptool
upload_speed = 921600
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
  -flto
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/esp32_s3_devkitc_n16r8_sx1262
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=0
