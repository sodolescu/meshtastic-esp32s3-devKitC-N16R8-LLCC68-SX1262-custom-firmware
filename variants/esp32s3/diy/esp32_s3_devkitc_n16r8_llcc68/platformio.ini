[env:esp32-s3-devkitc-n16r8-llcc68]
board_level = extra
extends = esp32s3_base
board = esp32-s3-devkitc-n16r8-llcc68
board_build.arduino.memory_type = dio_opi
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
upload_protocol = esptool
upload_speed = 921600
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/esp32_s3_devkitc_n16r8_llcc68
  -DBOARD_HAS_PSRAM
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=0
lib_ignore =
  ${esp32s3_base.lib_ignore}
  DFRobot_BMM150
